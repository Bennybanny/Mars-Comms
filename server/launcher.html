<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Mars Comms Launcher</title
  ><style>
    body {
      background: #111116;
      color: #eee;
      font: 16px system-ui;
      max-width: 560px;
      margin: 8vh auto;
      padding: 24px;
    }
    h1 {
      letter-spacing: -1px;
    }
    label {
      display: block;
      margin: 20px 0;
    }
    input,
    select,
    button {
      box-sizing: border-box;
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      background: #24242e;
      color: white;
      border: 1px solid #454552;
      border-radius: 8px;
    }
    button {
      background: #7350cf;
      cursor: pointer;
    }
    a {
      color: #ba9cff;
    }
    small {
      color: #bbb;
    }
    #status {
      line-height: 1.8;
      overflow-wrap: anywhere;
    }
  </style>
  <h1>MARS <span style="color: #aa86ff">COMMS</span></h1>
  <p>Local production intercom · Launcher</p>
  <form id="form">
    <label>Network Interface<select id="address"></select></label
    ><label
      >Port<input id="port" type="number" value="8090" min="1024" max="65535"
    /></label>
    <details>
      <summary>HTTPS · required for LAN microphones</summary>
      <p>
        Use a certificate trusted by every crew device. See README for mkcert
        setup.
      </p>
      <label
        >Certificate file path<input
          id="cert"
          placeholder="C:\…\mars.pem" /></label
      ><label
        >Private key file path<input id="key" placeholder="C:\…\mars-key.pem"
      /></label>
    </details>
    <button>Start Server</button>
  </form>
  <div id="status"></div>
  <script>
    const el = (id) => document.getElementById(id);
    async function refresh() {
      const s = await fetch("/status").then((r) => r.json());
      if (!el("address").options.length) {
        for (const i of [
          ...s.interfaces,
          { name: "Local testing", address: "127.0.0.1" },
        ]) {
          const o = document.createElement("option");
          o.value = i.address;
          o.textContent = i.name + " — " + i.address;
          el("address").append(o);
        }
        if (s.saved) {
          if (
            [...el("address").options].some((o) => o.value === s.saved.address)
          )
            el("address").value = s.saved.address;
          for (const id of ["port", "cert", "key"])
            if (s.saved[id]) el(id).value = s.saved[id];
        }
      }
      if (s.running) {
        el("form").hidden = true;
        el("status").replaceChildren();
        for (const text of [
          "Mars Comms is running",
          "mDNS: " + s.mdns,
          ...(!s.secure
            ? [
                "HTTP: microphone works on localhost only. Restart with HTTPS for LAN devices.",
              ]
            : []),
        ]) {
          const p = document.createElement("p");
          p.textContent = text;
          el("status").append(p);
        }
        for (const url of [s.url, s.mdnsUrl].filter(Boolean)) {
          const a = document.createElement("a");
          a.href = url;
          a.textContent = "Open Mars Comms — " + url;
          a.target = "_blank";
          a.rel = "noopener";
          el("status").append(a, document.createElement("br"));
        }
      }
    }
    el("form").onsubmit = async (e) => {
      e.preventDefault();
      try {
        const r = await fetch("/start", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-Launcher-Token": "__TOKEN__",
          },
          body: JSON.stringify({
            address: el("address").value,
            port: Number(el("port").value),
            cert: el("cert").value,
            key: el("key").value,
          }),
        });
        const s = await r.json();
        if (!r.ok) throw Error(s.error);
        refresh();
      } catch (e) {
        el("status").textContent = e.message;
      }
    };
    refresh();
    setInterval(refresh, 2000);
  </script>
</html>
